name: Daily NSE Market Data Sync

on:
  schedule:
    # Trigger at 11:30 AM UTC (5:00 PM IST) every weekday (Mon-Fri)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows manual run button in GitHub UI

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/python-version@v5
        with:
          python-version: '3.12'

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance sqlalchemy psycopg2-binary

      - name: Run Incremental Ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python update_daily_data.py